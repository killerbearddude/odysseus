# Example sysusers rules for optional hardened Odysseus deployment.
# Install as /etc/sysusers.d/odysseus.conf only after local review.

u odysseus-web - "Odysseus web service" /srv/odysseus/app /usr/sbin/nologin
u odysseus-runner - "Odysseus controlled runner" /srv/odysseus/workspaces /usr/sbin/nologin
u odysseus-model - "Odysseus model service" /srv/odysseus/models /usr/sbin/nologin
u odysseus-indexer - "Odysseus indexer service" /srv/odysseus/index /usr/sbin/nologin
u odysseus-diagnostics - "Odysseus diagnostics collector" /srv/odysseus/diagnostics /usr/sbin/nologin
m odysseus-web odysseus-runner
