# Example tmpfiles rules for optional hardened Odysseus deployment.
# Install as /etc/tmpfiles.d/odysseus.conf only after local review.

d /srv/odysseus 0750 root odysseus-web -
d /srv/odysseus/app 0750 root odysseus-web -
d /srv/odysseus/imports 0750 odysseus-web odysseus-web -
d /srv/odysseus/workspaces 0770 odysseus-web odysseus-runner -
d /srv/odysseus/documents 0750 odysseus-web odysseus-web -
d /srv/odysseus/diagnostics 0750 odysseus-diagnostics odysseus-diagnostics -
d /srv/odysseus/prompts 0750 odysseus-web odysseus-web -
d /srv/odysseus/index 0750 odysseus-web odysseus-web -
d /srv/odysseus/staging 0770 odysseus-web odysseus-runner -
d /srv/odysseus/staging/generated-scripts 0770 odysseus-web odysseus-runner -
d /srv/odysseus/staging/file-patches 0770 odysseus-web odysseus-runner -
d /srv/odysseus/staging/command-reviews 0770 odysseus-web odysseus-runner -
d /srv/odysseus/staging/rejected 0770 odysseus-web odysseus-runner -
d /srv/odysseus/models 0750 odysseus-model odysseus-model -
d /srv/odysseus/cache 0750 odysseus-model odysseus-model -
d /srv/odysseus/backups 0750 odysseus-web odysseus-web -
d /var/log/odysseus 0750 odysseus-web odysseus-web -
f /var/log/odysseus/audit.jsonl 0640 odysseus-web odysseus-web -
d /run/odysseus 0750 odysseus-web odysseus-web -
p /run/odysseus/broker.sock 0660 odysseus-web odysseus-web -
p /run/odysseus/runner.sock 0660 odysseus-runner odysseus-web -
p /run/odysseus/model.sock 0660 odysseus-model odysseus-web -
