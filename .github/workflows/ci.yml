# Core CI gates for Odysseus.
# These jobs are intentionally blocking: dependency installation, Python syntax,
# JavaScript syntax, unit tests, and security tests must fail the PR when broken.
name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  python-syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Compile Python sources
        run: python -m compileall -q app.py core routes src services scripts tests

  node-syntax:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d static ]; then
            echo "No static directory found; skipping JavaScript syntax check."
            exit 0
          fi
          if ! find static -name '*.js' -print -quit | grep -q .; then
            echo "No JavaScript files found under static/."
            exit 0
          fi
          find static -name '*.js' -print0 | xargs -0 -n1 node --check

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements.txt -r requirements-dev.txt
          elif [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt pytest pytest-asyncio
          else
            python -m pip install pytest pytest-asyncio fastapi starlette httpx
          fi

      - name: Run unit test marker set
        run: python -m pytest tests --ignore=tests/security

  security-tests:
    name: Security tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements.txt -r requirements-dev.txt
          elif [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt pytest pytest-asyncio
          else
            python -m pip install pytest pytest-asyncio fastapi starlette httpx
          fi

      - name: Run security test marker set
        run: if find tests/security -type f -name 'test_*.py' 2>/dev/null | grep -q .; then
  python -m pytest tests/security
else
  python -m pytest \
    tests/test_security_regressions.py \
    tests/test_api_chat_security.py \
    tests/test_url_safety.py \
    tests/test_tool_path_confinement.py \
    tests/test_reserved_username_admin_escalation.py \
    tests/test_companion_pairing.py \
    tests/test_internal_tool_auth.py
fi
